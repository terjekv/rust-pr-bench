name: Draft Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract release notes from changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import os

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = os.environ["TAG_NAME"].removeprefix("v")
          pattern = re.compile(
              rf"^## \[{re.escape(version)}\] - [^\n]*\n(?P<body>.*?)(?=^## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(changelog)
          if not match:
              raise SystemExit(f"Unable to find CHANGELOG entry for version {version}.")

          body = match.group("body").strip()
          if not body:
              raise SystemExit(f"CHANGELOG entry for version {version} is empty.")

          pathlib.Path("RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
